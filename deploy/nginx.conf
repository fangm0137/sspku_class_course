server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log off;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $go_api api:8080;
    # Go applies its bounded input limit AFTER authentication/authorization.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;
    proxy_next_upstream off;
    proxy_intercept_errors off;
    error_page 502 504 =503 @unavailable;

    location = /health {
        proxy_pass http://$go_api;
    }
    location /api/ {
        proxy_pass http://$go_api;
    }
    location = /api {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 404 '{"error":"not_found","message":"资源不存在"}';
    }
    location @unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"service_unavailable","message":"服务暂不可用"}';
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
