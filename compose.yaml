name: campusclaw

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-campusclaw}
      MYSQL_USER: ${DB_USER:-campusclaw}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command: ["--default-time-zone=+00:00", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_as_cs"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP --host=127.0.0.1 --user=\"$$MYSQL_USER\" --database=\"$$MYSQL_DATABASE\" --batch --skip-column-names --execute='SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-campusclaw}
      DB_USER: ${DB_USER:-campusclaw}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      HTTP_ADDR: 0.0.0.0:8080
      UPLOAD_DIR: /data/uploads
      # 检索与问答的外部依赖全部可选：缺失时 api 仍能启动，
      # 问答自动退化为只用关键字路径（没有对话网关则如实返回 503）。
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      CHAT_MODEL: ${CHAT_MODEL:-}
      # 工具循环的三项配额；全部可选，缺省 10s / 3 轮 / 单轮 4 次。
      MCP_CALL_TIMEOUT: ${MCP_CALL_TIMEOUT:-}
      MCP_MAX_ROUNDS: ${MCP_MAX_ROUNDS:-}
      MCP_MAX_CALLS: ${MCP_MAX_CALLS:-}
      # 可选：MCP 令牌的加密子密钥。留空则由 TOKEN_SECRET 派生。
      MCP_TOKEN_KEY: ${MCP_TOKEN_KEY:-}
    volumes:
      - material_data:/data
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # 外部工具的被调用方：同仓库的最小 MCP 服务端，供"接入外部工具"这一项能力实测。
  # 它不依赖数据库，也不引用 api 的任何代码，可以单独起停。
  mcp:
    build:
      context: .
      dockerfile: deploy/mcp.Dockerfile
    environment:
      # 令牌只从环境读取；留空时 /mcp 一律 401（宁可不可用，也不允许"谁都能调"）。
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ADDR: 0.0.0.0:8090
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: deploy/nginx.Dockerfile
    ports:
      - "127.0.0.1:${CAMPUSCLAW_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  mysql_data:
  material_data:
  qdrant_data:
